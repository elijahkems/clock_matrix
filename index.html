<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock Matrix</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DotGothic16&display=swap");

      :root {
        --bg-color: black;
        --text-main: #e0e0e0;
        --text-accent: #d74d32;
        --dot-off: #1a1a1a;
        --dot-grey: #6e6e6e;
        --dot-dark: #3a3a3a;
        --dot-black: #0d0d0d;
      }

      * {
        background-color: var(--bg-color);
        box-sizing: border-box;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        color: var(--text-main);
        font-family: "DotGothic16", monospace;
        overflow: hidden;
        user-select: none;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        transition: filter 3s ease;
      }

      body.night-dim {
        filter: brightness(0.55);
      }

      /* Fullscreen Landscape Layout (Tight 640x320 optimized) */
      .screen {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        padding: 0;
        margin: 0;
        gap: clamp(4px, 1.5vw, 16px);
      }

      /* Left Side: Clock + Info flush together */
      .left-col {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1vh;
        flex: 1;
        height: 100%;
      }

      /* Right Side: Dot Matrix Icon maximized */
      .right-col {
        display: flex;
        justify-content: center;
        align-items: center;
        flex: 1;
        height: 100%;
      }

      .info-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(2px, 1vh, 8px);
      }

      .icon {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .dot-icon {
        display: grid;
        grid-template-columns: repeat(21, 1fr);
        gap: 2px;
        width: clamp(120px, 82vh, 310px);
      }

      .dot-icon span {
        aspect-ratio: 1;
        border-radius: 50%;
        background: transparent;
        transition:
          background 1.8s ease,
          opacity 1.8s ease;
      }

      .dot-icon span.on-grey {
        background: var(--dot-grey);
      }
      .dot-icon span.on-dark {
        background: var(--dot-dark);
      }
      .dot-icon span.on-black {
        background: var(--dot-black);
      }

      .weather,
      .date {
        font-size: clamp(0.65rem, 4vh, 1.15rem);
        text-transform: uppercase;
        white-space: nowrap;
      }

      .accent {
        color: var(--text-accent);
      }

      .time {
        font-size: clamp(3.5rem, 28vh, 10rem);
        line-height: 0.95;
        letter-spacing: 2px;
        text-align: center;
      }

      .prompt-box {
        margin-top: 0.5vh;
        border: 1px solid #444;
        border-radius: 25px;
        padding: clamp(3px, 1vh, 8px) clamp(10px, 2vw, 24px);
        font-size: clamp(0.5rem, 2.5vh, 0.85rem);
        color: #888;
        background: none;
        font-family: inherit;
        letter-spacing: inherit;
        cursor: pointer;
        white-space: nowrap;
        -webkit-tap-highlight-color: transparent;
      }

      .prompt-box:active {
        background: #1a1a1a;
        border-color: var(--text-accent);
      }

      .prompt-box .accent {
        color: var(--text-accent);
        font-weight: bold;
      }

      .stats {
        position: fixed;
        top: 10px;
        left: 14px;
        font-family: "DotGothic16", monospace;
        font-size: 0.65rem;
        letter-spacing: 1px;
        color: #999;
        text-transform: uppercase;
        z-index: 10;
      }

      /* Portrait Fallback: Stack vertically (Icon -> Clock -> Info) */
      @media (orientation: portrait) {
        .screen {
          flex-direction: column;
          justify-content: center;
          gap: 3vh;
          padding: 2vh 2vw;
        }

        .left-col,
        .right-col {
          display: contents;
        }

        .icon {
          order: 1;
        }

        .time {
          order: 2;
          font-size: clamp(3.5rem, 14vh, 8rem);
        }

        .info-col {
          order: 3;
        }

        .dot-icon {
          width: clamp(120px, 25vh, 250px);
        }
      }
    </style>
  </head>
  <body>
    <div class="stats" id="stats">MEM --</div>

    <div class="screen">
      <!-- Left Area: Clock + Info -->
      <div class="left-col">
        <div class="time" id="clock">00:00</div>
        <div class="info-col">
          <div class="weather">
            AUSTIN HIGH <span class="accent" id="temp-high">--°</span> LOW
            <span class="accent" id="temp-low">--°</span>
          </div>
          <div class="date" id="date-display">
            DAY. <span class="accent">00 MON</span>
          </div>
          <button type="button" id="clear-btn" class="prompt-box">
            press <span class="accent">✓</span> clear memory
          </button>
        </div>
      </div>

      <!-- Right Area: Dot Matrix Icon -->
      <div class="right-col">
        <div class="icon">
          <div class="dot-icon" id="matrix-icon"></div>
        </div>
      </div>
    </div>

    <script>
      const matrixIcon = document.getElementById("matrix-icon");
      const cols = 21;
      const rows = 21;
      const totalDots = cols * rows;
      const spans = [];

      for (let i = 0; i < totalDots; i++) {
        const span = document.createElement("span");
        matrixIcon.appendChild(span);
        spans.push(span);
      }

      function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        document.getElementById("clock").textContent = `${hours}:${minutes}`;

        const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
        const months = [
          "JAN",
          "FEB",
          "MAR",
          "APR",
          "MAY",
          "JUN",
          "JUL",
          "AUG",
          "SEP",
          "OCT",
          "NOV",
          "DEC",
        ];

        document.getElementById("date-display").innerHTML =
          `${days[now.getDay()]}. <span class="accent">${now.getDate()} ${months[now.getMonth()]}</span>`;
      }

      const tierClass = ["", "on-grey", "on-dark", "on-black"];

      function randRange(min, max) {
        return min + Math.random() * (max - min);
      }

      function randomTier() {
        const r = Math.random();
        if (r < 0.3) return 3;
        if (r < 0.65) return 2;
        return 1;
      }

      function createMainBlob(startX) {
        return {
          type: "main",
          x: startX !== undefined ? startX : randRange(-2, cols + 2),
          y: randRange(2, rows - 3),
          r: randRange(3, 7),
          tier: randomTier(),
        };
      }

      function createSmallBlob() {
        return {
          type: "small",
          x: randRange(-3, cols + 3),
          y: randRange(0, rows - 1),
          r: randRange(0.6, 1.6),
          tier: randomTier(),
        };
      }

      const MAIN_COUNT = 4;
      const SMALL_COUNT = 10;
      const MAIN_GAP_MIN = 0.5;
      const MAIN_GAP_MAX = 2;

      let blobs = [];
      for (let i = 0; i < MAIN_COUNT; i++) blobs.push(createMainBlob());
      for (let i = 0; i < SMALL_COUNT; i++) blobs.push(createSmallBlob());

      const grid = new Uint8Array(totalDots);
      const influence = new Float32Array(totalDots);

      function render() {
        grid.fill(0);
        influence.fill(0);

        for (let i = 0; i < blobs.length; i++) {
          const b = blobs[i];
          const minX = Math.max(0, Math.floor(b.x - b.r));
          const maxX = Math.min(cols - 1, Math.ceil(b.x + b.r));
          const minY = Math.max(0, Math.floor(b.y - b.r));
          const maxY = Math.min(rows - 1, Math.ceil(b.y + b.r));

          for (let y = minY; y <= maxY; y++) {
            for (let x = minX; x <= maxX; x++) {
              const dx = x - b.x;
              const dy = y - b.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              const inf = 1 - dist / b.r;

              if (inf > 0.12) {
                const idx = y * cols + x;
                if (inf > influence[idx]) {
                  influence[idx] = inf;
                  grid[idx] = b.tier;
                }
              }
            }
          }
        }

        for (let i = 0; i < totalDots; i++) {
          const tier = grid[i];
          spans[i].className = tier ? tierClass[tier] : "";
        }
      }

      function countType(t) {
        let c = 0;
        for (let i = 0; i < blobs.length; i++) {
          if (blobs[i].type === t) c++;
        }
        return c;
      }

      function driftBlobs() {
        const moveAmount = 1.2;

        for (let i = blobs.length - 1; i >= 0; i--) {
          const b = blobs[i];
          b.x -= b.type === "small" ? moveAmount * 0.6 : moveAmount;
          if (b.x + b.r < -1) {
            blobs.splice(i, 1);
          }
        }

        while (countType("main") < MAIN_COUNT) {
          blobs.push(
            createMainBlob(cols + randRange(MAIN_GAP_MIN, MAIN_GAP_MAX)),
          );
        }
        while (countType("small") < SMALL_COUNT) {
          blobs.push(createSmallBlob());
        }

        render();
        updateStats();
      }

      const statsEl = document.getElementById("stats");
      function updateStats() {
        let memText = "MEM N/A";
        if (performance.memory) {
          const used = (performance.memory.usedJSHeapSize / 1048576).toFixed(1);
          const limit = (performance.memory.jsHeapSizeLimit / 1048576).toFixed(
            0,
          );
          memText = `MEM ${used}/${limit}MB`;
        }
        statsEl.textContent = `${memText} · BLOBS ${blobs.length}`;
      }

      const NIGHT_START_HOUR = 22;
      const NIGHT_END_HOUR = 7;
      function updateNightDim() {
        const hour = new Date().getHours();
        const isNight = hour >= NIGHT_START_HOUR || hour < NIGHT_END_HOUR;
        document.body.classList.toggle("night-dim", isNight);
      }

      function requestWakeLock() {
        try {
          if ("wakeLock" in navigator) {
            navigator.wakeLock.request("screen").catch(function () {});
          }
        } catch (e) {}
      }
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") requestWakeLock();
      });
      requestWakeLock();

      setInterval(updateClock, 1000);
      updateClock();

      updateNightDim();
      setInterval(updateNightDim, 60 * 1000);

      render();
      updateStats();
      setInterval(driftBlobs, 2000);

      document
        .getElementById("clear-btn")
        .addEventListener("click", function () {
          location.reload();
        });

      const SELF_CLEAN_INTERVAL_MS = 6 * 60 * 60 * 1000;
      setTimeout(function () {
        location.reload();
      }, SELF_CLEAN_INTERVAL_MS);
    </script>
  </body>
</html>
