<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock Matrix</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DotGothic16&display=swap");

      :root {
        --bg-color: #050505;
        --text-main: #e0e0e0;
        --text-accent: #d74d32;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: "DotGothic16", monospace;
        overflow: hidden;
        user-select: none;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        transition: filter 3s ease; /* smooth fade into night-dim, no jarring snap */
      }

      body.night-dim {
        filter: brightness(0.55);
      }

      /* sized with vh so it stays centered and legible regardless of screen
     size or orientation -- height is usually the limiting dimension on a
     phone in landscape, so scale off that rather than vw */
      .screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5vh;
        letter-spacing: 2px;
        text-align: center;
        padding: 4vh 6vw;
        box-sizing: border-box;
        max-width: 100vw;
        max-height: 100vh;
      }

      .time {
        font-size: clamp(2.5rem, 20vh, 9rem);
        line-height: 1;
        letter-spacing: 4px;
      }

      .date {
        font-size: clamp(0.7rem, 4vh, 1.3rem);
        text-transform: uppercase;
      }

      .location {
        font-size: clamp(0.6rem, 3vh, 1rem);
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #999;
      }

      .accent {
        color: var(--text-accent);
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="location">Austin</div>
      <div class="time" id="clock">00:00</div>
      <div class="date" id="date-display">
        DAY. <span class="accent">00 MON</span>
      </div>
    </div>

    <script>
      function updateClock() {
        var now = new Date();
        var hours = String(now.getHours()).padStart(2, "0");
        var minutes = String(now.getMinutes()).padStart(2, "0");
        document.getElementById("clock").textContent = hours + ":" + minutes;

        var days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
        var months = [
          "JAN",
          "FEB",
          "MAR",
          "APR",
          "MAY",
          "JUN",
          "JUL",
          "AUG",
          "SEP",
          "OCT",
          "NOV",
          "DEC",
        ];

        document.getElementById("date-display").innerHTML =
          days[now.getDay()] +
          '. <span class="accent">' +
          now.getDate() +
          " " +
          months[now.getMonth()] +
          "</span>";
      }

      // dim automatically at night so the screen isn't glaring a foot from your face
      var NIGHT_START_HOUR = 22; // 10pm
      var NIGHT_END_HOUR = 7; // 7am
      function updateNightDim() {
        var hour = new Date().getHours();
        var isNight = hour >= NIGHT_START_HOUR || hour < NIGHT_END_HOUR;
        document.body.classList.toggle("night-dim", isNight);
      }

      // keep the screen awake -- a software fallback alongside any native
      // FLAG_KEEP_SCREEN_ON / kiosk launcher setting on the device itself
      function requestWakeLock() {
        try {
          if ("wakeLock" in navigator) {
            navigator.wakeLock.request("screen").catch(function () {});
          }
        } catch (e) {
          // wake lock isn't available/granted -- not critical, fail silently
        }
      }
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") requestWakeLock();
      });
      requestWakeLock();

      setInterval(updateClock, 1000);
      updateClock();

      updateNightDim();
      setInterval(updateNightDim, 60 * 1000); // check every minute

      // silent full self-refresh periodically so the tab never accumulates
      // memory over days/weeks of unattended runtime
      var SELF_CLEAN_INTERVAL_MS = 6 * 60 * 60 * 1000; // every 6 hours
      setTimeout(function () {
        location.reload();
      }, SELF_CLEAN_INTERVAL_MS);
    </script>
  </body>
</html>
