<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Kiosk Clock</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

  :root {
    --bg-color: #050505;
    --text-main: #e0e0e0;
    --text-accent: #d74d32;
  }

  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: 'DotGothic16', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    user-select: none;
  }

  .screen {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    letter-spacing: 2px;
  }

  .icon {
    font-size: 2.2rem;
    margin-bottom: 8px;
  }

  .weather {
    font-size: 1.1rem;
    text-transform: uppercase;
  }

  .accent {
    color: var(--text-accent);
  }

  .time {
    font-size: 6rem;
    margin: -15px 0;
    line-height: 1;
    letter-spacing: 4px;
  }

  .date {
    font-size: 1.1rem;
    text-transform: uppercase;
  }

  .prompt-box {
    margin-top: 50px;
    border: 1px solid #444;
    border-radius: 25px;
    padding: 8px 24px;
    font-size: 0.9rem;
    color: #888;
  }

  .prompt-box .accent {
    color: var(--text-accent);
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="screen">
  <div class="icon">☀</div>
  <div class="weather">FAIR <span class="accent">30°</span></div> 
  <div class="time" id="clock">00:00</div>
  <div class="date" id="date-display">DAY. <span class="accent">00 MON</span></div>
  <div class="prompt-box">press <span class="accent">✓</span> to start</div>
</div>

<script>
  function updateClock() {
    const now = new Date();
    
    // Time Logic
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clock').textContent = `${hours}:${minutes}`;

    // Date Logic
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    
    const dayName = days[now.getDay()];
    const dayNum = now.getDate();
    const monthName = months[now.getMonth()];
    
    document.getElementById('date-display').innerHTML = 
      `${dayName}. <span class="accent">${dayNum} ${monthName}</span>`;
  }

  // Initialize and loop
  setInterval(updateClock, 1000);
  updateClock();
</script>
</body>
</html>
